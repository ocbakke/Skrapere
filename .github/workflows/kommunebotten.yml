name: Kommunejournalen og domstolsjekkeren SA

on:
  schedule:
    # Kjører kl. 05:12 UTC hver dag
    # Ca. 06:12 norsk vintertid / 07:12 sommertid
    - cron: '12 5 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EPOST_BRUKER: ${{ secrets.EPOST_BRUKER }}
      EPOST_PASSORD: ${{ secrets.EPOST_PASSORD }}
      EPOST_MOTTAKER: ${{ secrets.EPOST_MOTTAKER }}

    steps:
      - name: Sjekk ut kode
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer avhengigheter
        run: pip install -r requirements.txt

      - name: Kjør kommune-roboten
        run: python kommunebotten.py

      - name: Kjør domstolsjekkeren
        run: python domstolsjekkeren_scraper.py

      - name: Lagre cache tilbake til GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          git add sette_dokumenter.txt cache_sa.json

          if ! git diff --cached --quiet; then
            git commit -m "Oppdatert cache for scrapers"
            git pull --rebase
            git push
          else
            echo "Ingen endringer å lagre."
          fi
