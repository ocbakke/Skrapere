name: Domstolsjekkeren SA

on:
  schedule:
    # Kjører hver dag kl. 05:13 UTC
    # Ca. 06:13 norsk vintertid / 07:13 sommertid
    - cron: '13 5 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      EPOST_BRUKER: ${{ secrets.EPOST_BRUKER }}
      EPOST_PASSORD: ${{ secrets.EPOST_PASSORD }}
      EPOST_MOTTAKER: ${{ secrets.EPOST_MOTTAKER }}

    steps:
      - name: Sjekk ut kode
        uses: actions/checkout@v7

      - name: Sett opp Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Installer avhengigheter
        run: pip install -r requirements.txt

      - name: Kjør domstolsjekkeren
        run: python domstolsjekkeren_scraper.py

      - name: Lagre cache tilbake til GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          git add cache_sa.json

          if ! git diff --cached --quiet; then
            git commit -m "Oppdatert cache for SA"
            git pull --rebase
            git push
          else
            echo "Ingen cache-endringer å lagre."
          fi
